<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 风险监控 · 实时新闻流</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Bloomberg 风格顶部滚动新闻条 -->
    <div class="ticker-bar" id="ticker-bar">
        <div class="ticker-brand">
            <span class="ticker-dot"></span>AI RISK <span class="ticker-live">LIVE</span>
        </div>
        <div class="ticker-viewport">
            <div class="ticker-track" id="ticker-track">
                <span class="ticker-loading">正在连接国际新闻源…</span>
            </div>
        </div>
        <button class="ticker-pause" id="ticker-pause" title="暂停/继续">❚❚</button>
    </div>

    <div class="container">
        <header class="dashboard-header">
            <div>
                <h1>AI 风险监控</h1>
                <p class="subtitle">基于国际实时新闻的 AI 风险推测 · 估值泡沫 / 监管 / 安全 / 产业冲击</p>
            </div>
            <div class="risk-score">
                <div class="score-label">全球风险指数</div>
                <div class="score-main">
                    <span class="score-display" id="global-score">--</span>
                    <span class="score-denom">/ 10</span>
                </div>
                <div class="trend" id="trend">--</div>
            </div>
        </header>

        <main class="dashboard-content">
            <section class="events-section">
                <div class="section-header">
                    <h2>实时新闻流 <span class="news-count" id="news-count">0</span></h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="critical">严重</button>
                        <button class="filter-btn" data-filter="high">高危</button>
                        <button class="filter-btn" data-filter="medium">中等</button>
                        <button class="filter-btn" data-filter="low">低危</button>
                    </div>
                </div>
                <div id="events-container" class="events-list">
                    <div class="loading-card">正在加载国际新闻…</div>
                </div>
            </section>

            <aside class="details-section">
                <div class="info-panel">
                    <h2>风险维度</h2>
                    <div id="dimensions" class="dimensions">
                        <div class="dim-loading">计算中…</div>
                    </div>
                </div>

                <div class="info-panel">
                    <h2>统计数据</h2>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-value" id="total-events">0</div><div class="stat-label">新闻总数</div></div>
                        <div class="stat-item"><div class="stat-value critical" id="critical-events">0</div><div class="stat-label">严重事件</div></div>
                        <div class="stat-item"><div class="stat-value high" id="high-events">0</div><div class="stat-label">高危事件</div></div>
                        <div class="stat-item"><div class="stat-value" id="last-update">--</div><div class="stat-label">最后更新</div></div>
                    </div>
                </div>

                <div class="info-panel">
                    <h2>数据源状态 <button class="refresh-btn" id="refresh-btn">↻ 刷新</button></h2>
                    <div id="sources-container" class="sources-list">
                        <div class="dim-loading">检测中…</div>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="dashboard-footer">
            <span>每 3 分钟自动刷新 · 风险评分为关键词模型推测，仅供参考 · 数据来自公开 RSS 国际新闻源</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
